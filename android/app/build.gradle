apply plugin: 'com.android.application'

android {
    namespace = "id.resqbox.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "id.resqbox.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    /*
      PAGAR AGAR BERKAS .gz DI DALAM ASET TIDAK MENGGAGALKAN BUILD

      ═══════════════════════════════════════════════════════════════════════
      MASALAH YANG PERNAH TERJADI
      ═══════════════════════════════════════════════════════════════════════

        Build APK gagal dengan:

            :app:mergeDebugAssets FAILED
            Duplicate resources
              public/terrain-688.stl
              public/terrain-688.stl.gz

        Sebabnya `public/` memuat DUA berkas berisi data yang sama:

            terrain-688.stl     3,02 MB  (asli)
            terrain-688.stl.gz  0,92 MB  (hasil kompresi berkas di atas)

        Di web, kehadiran keduanya memang disengaja: aplikasi memuat `.gz`
        lebih dahulu (menghemat 2,1 MB), lalu beralih ke `.stl` bila
        dekompresi tidak didukung. Itu pilihan yang baik untuk web.

        Tetapi di dalam APK keduanya ikut dikemas — 3,9 MB untuk satu model
        yang sama — dan Gradle menolaknya sebagai sumber kembar.

      ═══════════════════════════════════════════════════════════════════════
      MENGAPA PAGAR INI ADA DI SINI, BUKAN DI SKRIP
      ═══════════════════════════════════════════════════════════════════════

        Sudah ada `scripts/siapkan-aset-android.mjs` yang menghapus `.gz` dari
        aset Android. Skrip itu BENAR, dan tetap dipertahankan.

        Tetapi skrip itu hanya berjalan bila seseorang memakai perintah
        `npm run android:sync`. Bila ada yang menjalankan `cap sync android`
        secara langsung — dan itu yang terjadi pada build ini — skrip itu
        TERLEWAT, `.gz` ikut tersalin, dan build gagal dengan pesan yang
        tidak menjelaskan apa pun tentang penyebab sebenarnya.

        Memperbaiki masalah lewat sebuah LANGKAH yang harus diingat orang
        adalah perbaikan yang rapuh: cepat atau lambat akan terlewat lagi.

        Karena itu `.gz` dikecualikan di sini, pada tingkat Gradle, sehingga
        berlaku untuk SIAPA PUN yang menjalankan build dengan cara apa pun.

      ═══════════════════════════════════════════════════════════════════════
      MENGAPA `.stl` YANG DIPERTAHANKAN, BUKAN `.gz`
      ═══════════════════════════════════════════════════════════════════════

        `.stl` adalah berkas ASLI dan selalu dapat dipakai; tidak ada syarat
        khusus untuk membacanya.

        `.gz` memerlukan `DecompressionStream('gzip')`. Di peramban modern API
        itu tersedia, tetapi WebView Android versi lama belum tentu punya.
        Menyimpan berkas yang hanya berguna bila API tertentu ada — sambil
        menambah 0,92 MB dan menggagalkan build — tidak sepadan.

        Jadi `.stl` dipertahankan, dan model 3D dijamin dapat dimuat di
        perangkat apa pun.
    */
    androidResources {
        ignoreAssetsPattern = '!*.gz'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
