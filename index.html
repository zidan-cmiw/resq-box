<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon ringan: sebelumnya memakai logo.png/JPEG 1024px sebesar 367 KB -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Ikon PWA: dulu dirujuk manifest, tetapi berkasnya tidak pernah ada -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      META VIEWPORT

      `viewport-fit=cover` membuat halaman memakai seluruh layar, termasuk
      area poni dan lengkung sudut. Penanganan safe area-nya ada di index.css
      (kelas `.safe-area-pad`).

      `interactive-widget=resizes-content` adalah yang TERPENTING di sini.
      Tanpa itu, saat papan ketik terbuka di iPad, tinggi halaman TIDAK
      menyesuaikan — halaman tetap setinggi layar penuh sementara wilayah yang
      terlihat menyusut menjadi sekitar 460px. Akibatnya kolom password dan
      tombol "MULAI PETUALANGAN" berada DI BAWAH papan ketik dan tidak dapat
      dicapai.

      Dengan `resizes-content`, tinggi tata letak ikut menyusut ketika papan
      ketik muncul, sehingga isi halaman tetap berada di wilayah yang terlihat
      dan dapat digulir dengan benar.

      Catatan: `user-scalable=no` sengaja DIPERTAHANKAN. Ini aplikasi
      permainan dengan kendali sentuh; cubit-untuk-zoom akan mengacaukan
      koordinat sentuhan permainan. Meskipun begitu, `maximum-scale` dan
      `user-scalable` tidak lagi dipatuhi sebagian peramban modern, sehingga
      tidak ada salahnya tetap ditulis.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Platform media pembelajaran IPA interaktif & simulasi mitigasi bencana untuk SMP Kelas 8" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!--
      TIGA keluarga font, masing-masing punya peran (jangan disatukan):

      • Plus Jakarta Sans (400–800) — TEKS ISI: dialog, paragraf, label form,
        tooltip, papan skor. Di sinilah perbaikan keterbacaan diterapkan:
        sebelumnya ada 651 teks berukuran 7–11px yang tidak terbaca.

      • Press Start 2P — PLAKAT & JUDUL bergaya pixel (tombol dashboard,
        badge status, judul level, logo). Dipakai lewat kelas font-pixel-title
        dan aturan .pixel-btn*. Ini bagian dari identitas visual project,
        bukan masalah keterbacaan.

      • Pixelify Sans + JetBrains Mono — label di dalam diagram SVG ilmiah
        dan teks berkode (kode Arduino, PIN, angka teknis).

      Catatan: Press Start 2P hanya punya SATU bobot, sehingga font-bold dan
      font-black tidak berpengaruh padanya.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <title>RESQ-BOX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
